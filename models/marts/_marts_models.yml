# models/marts/_marts_models.yml
#
# Schema for the marts layer: dimensional models + the central fact.
# Descriptions document the analytical contract; relationships tests
# prove every fact-table foreign key resolves to a real dim row.
#
# Seeds (dim_date.csv) are also documented here so the entire marts
# layer is described in one file.

version: 2

seeds:
  - name: dim_date
    description: >
      Calendar dimension spanning 2015-01-01 through 2030-12-31.
      One row per day. Generated by a one-shot Python script and
      checked in as a CSV seed; see Lesson 5 for the generator
      logic. The 2015-2030 range comfortably brackets Memphis
      crime data history with room for future loads.
    columns:
      - name: date_key
        description: YYYYMMDD as integer. The join key for the fact table.
        data_tests:
          - not_null
          - unique
      - name: full_date
        description: ISO-formatted date (YYYY-MM-DD).
        data_tests:
          - not_null
      - name: year
        description: Calendar year as integer.
      - name: quarter
        description: Calendar quarter, 1-4.
      - name: month_num
        description: Calendar month as integer, 1-12.
      - name: month_name
        description: Full English month name.
      - name: day_of_month
        description: Day of the month, 1-31.
      - name: day_of_week
        description: ISO day of week, 1=Monday through 7=Sunday.
      - name: day_name
        description: Full English day name.
      - name: is_weekend
        description: True for Saturday and Sunday.
      - name: week_of_year
        description: ISO week number.

models:
  - name: dim_location
    description: >
      Administrative location dimension. One row per distinct
      (ward, precinct, council_district) combination observed in
      the staging layer, including a row for incidents reported
      without an administrative location (all three columns NULL).
    columns:
      - name: location_key
        description: Surrogate key. md5 hash over the natural-key columns.
        data_tests:
          - not_null
          - unique
      - name: ward
        description: City ward identifier from the source.
      - name: precinct
        description: MPD precinct identifier from the source.
      - name: council_district
        description: City Council district identifier from the source.

  - name: dim_offense
    description: >
      Offense classification dimension. One row per distinct
      (offense_category, offense_description) combination observed
      in the staging layer. Slowly-changing — offense_description
      wording occasionally gets updated upstream; Lesson 7's
      snapshot captures that history.
    columns:
      - name: offense_key
        description: Surrogate key. md5 hash over the natural-key columns.
        data_tests:
          - not_null
          - unique
      - name: offense_category
        description: Broader classification of the offense, lowercased.
      - name: offense_description
        description: Human-readable description of the offense, lowercased.

  - name: fct_incidents
    description: >
      Central fact table for incident analysis. One row per
      reported incident. Each row carries surrogate-key foreign
      keys to the conformed dimensions plus a handful of incident-
      level attributes (lat/lng, street address) that don't roll
      up to a dim.
    columns:
      - name: incident_id
        description: >
          Natural key from the source system. Functions as a
          degenerate dimension on the fact.
        data_tests:
          - not_null
          - unique
      - name: date_key
        description: FK to dim_date. YYYYMMDD as integer.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: location_key
        description: FK to dim_location.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_key
      - name: offense_key
        description: FK to dim_offense.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_offense')
              field: offense_key
      - name: offense_datetime
        description: Full timestamp of the incident. Use for hour-of-day analysis.
      - name: latitude
        description: Latitude in decimal degrees (WGS 84). NULL when unknown.
      - name: longitude
        description: Longitude in decimal degrees (WGS 84). NULL when unknown.
      - name: street_address
        description: Free-text address or block range from the source.
      - name: incident_count
        description: >
          Always 1. Present so BI tools can express incident
          counts as SUM(incident_count) instead of COUNT(*).
        data_tests:
          - not_null
