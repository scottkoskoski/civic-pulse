# packages.yml
#
# dbt's package manager pulls in reusable macros and models from
# other dbt projects (think of it as npm/pip for dbt). When you
# run `dbt deps`, dbt clones each package into ./dbt_packages/.
#
# This file is intentionally empty in Lesson 1. We add `dbt_utils`
# in Lesson 6, once we have enough repeated SQL to motivate the
# DRY-ification it enables.
#
# Example (uncommented in Lesson 6):
# packages:
#   - package: dbt-labs/dbt_utils
#     version: [">=1.1.0", "<2.0.0"]

packages: []
